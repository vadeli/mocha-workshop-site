name: Update leaderboard data

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch CodaBench leaderboard
        run: python scripts/update_leaderboard.py

      - name: Commit refreshed leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leaderboard.json
          if git diff --cached --quiet; then
            echo "Leaderboard data is already up to date."
          else
            git commit -m "Update Codabench leaderboard data"
            git push
          fi
